version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: jobistan_db
    environment:
      POSTGRES_USER: jobistan_user
      POSTGRES_PASSWORD: jobistan_password
      POSTGRES_DB: jobistan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobistan_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
